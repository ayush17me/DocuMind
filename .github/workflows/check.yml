name: Check DocuMind
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: docker build -t documind .
      - run: docker run --rm documind python -c "import streamlit, faiss, pypdf, langchain_google_genai"
